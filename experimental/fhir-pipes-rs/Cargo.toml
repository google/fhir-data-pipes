[package]
name = "fhir-pipes-rs"
version = "0.1.0"
edition = "2021"
description = "Lightweight, high-performance Rust alternative to OHS fhir-data-pipes (FHIR to Nested Parquet & SQL-on-FHIR v2 Materialized Views)"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
arrow-array = "53"
arrow-buffer = "53"
arrow-schema = "53"
arrow-json = "53"
parquet = { version = "53", default-features = false, features = ["arrow", "snap", "flate2"] }
